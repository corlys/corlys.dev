{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corlys.DEV</title>
  <meta name="description" content="corlys development diary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap">
  <!-- ponytail: browser build, dev only; switch to standalone CLI output inlined in <style> for prod -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-background: #fff;
      --color-foreground: #0a0a0a;
      --color-primary: #171717;
      --color-primary-foreground: #fafafa;
      --color-card: #fff;
      --color-card-foreground: #0a0a0a;
      --color-muted-foreground: #737373;
      --color-accent: #f5f5f5;
      --color-accent-foreground: #171717;
      --color-border: #e5e5e5;
      --color-input: #e5e5e5;
      --color-ring: #0a0a0a;
      --animate-blob: blob 7s infinite;
      @keyframes blob {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
      }
    }
    .dark {
      --color-background: #0a0a0a;
      --color-foreground: #fafafa;
      --color-primary: #fafafa;
      --color-primary-foreground: #171717;
      --color-card: #0a0a0a;
      --color-card-foreground: #fafafa;
      --color-muted-foreground: #a3a3a3;
      --color-accent: #262626;
      --color-accent-foreground: #fafafa;
      --color-border: #262626;
      --color-input: #262626;
      --color-ring: #d4d4d4;
    }
    @utility animation-delay-2000 { animation-delay: 2s; }
    @utility animation-delay-4000 { animation-delay: 4s; }
  </style>
  <!-- ponytail: replaces next-themes (system theme only, no toggle existed) -->
  <script>
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const sync = () => document.documentElement.classList.toggle("dark", mq.matches);
    sync(); mq.addEventListener("change", sync);
  </script>
</head>
<body class="font-['Albert_Sans'] antialiased bg-background text-foreground">
  {{template "content" .}}
</body>
</html>{{end}}

{{define "back"}}
<div class="mb-8">
  <a href="{{.Back}}" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring h-9 px-4 py-2 border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground">{{.BackLabel}}</a>
</div>
{{end}}

{{define "blobs"}}
<div class="z-0 pointer-events-none">
  <div class="fixed -top-20 -left-20 w-72 h-72 {{if eq . "green"}}bg-green-300{{else}}bg-blue-300{{end}} rounded-full opacity-70 mix-blend-multiply filter blur-xl animate-blob animation-delay-2000"></div>
  <div class="fixed -bottom-20 -right-20 w-72 h-72 {{if eq . "green"}}bg-green-300{{else}}bg-blue-300{{end}} rounded-full opacity-70 mix-blend-multiply filter blur-xl animate-blob animation-delay-4000"></div>
</div>
{{end}}
